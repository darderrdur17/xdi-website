<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Details - XDi</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="details-page">
    <div class="details-background"></div>
    
    <div class="details-logo">XDi</div>
    
    <div class="details-close">
        <a href="../index.html" class="details-close-link">
            <svg width="22.37" height="22.37" viewBox="0 0 24 24" fill="none" stroke="rgba(255, 255, 255, 0.6)" stroke-width="2">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        </a>
    </div>
    
    <div class="details-back">
        <a href="contact.html" class="details-back-link">← Back</a>
    </div>

    <div class="details-search-box">
        <div class="details-title">Let's Talk</div>
        <div class="details-line"></div>
        
        <form id="detailsForm" class="details-form">
            <div class="details-input-group">
                <input type="text" id="name" name="name" placeholder="Name" class="details-input" required>
            </div>
            
            <div class="details-input-group">
                <input type="email" id="email" name="email" placeholder="Email" class="details-input" required>
            </div>
            
            <button type="submit" class="details-submit-btn">
                <div class="details-submit-bg"></div>
                <span class="details-submit-text">Submit</span>
            </button>
        </form>
    </div>

    <script src="../js/script.js"></script>
</body>
</html>
