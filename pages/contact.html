<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - XDi</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="contact-page">
    <div class="page-3-background"></div>
    
    <div class="page-3-logo">XDi</div>
    
    <div class="page-3-close">
        <a href="../index.html">
            <svg width="22.37" height="22.37" viewBox="0 0 24 24" fill="none" stroke="rgba(255, 255, 255, 0.6)" stroke-width="2">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        </a>
    </div>

    <div class="page-3-search-box">
        <div class="page-3-title">Let's Talk</div>
        <div class="page-3-line"></div>
        
        <form id="contactForm" class="page-3-form">
            <div class="page-3-content-box">
                <textarea id="content" name="content" placeholder="Content" class="page-3-content-input"></textarea>
            </div>
            
            <button type="submit" class="page-3-submit-btn">
                <div class="page-3-submit-bg"></div>
                <span class="page-3-submit-text">Submit</span>
            </button>
        </form>
    </div>

    <script src="../js/script.js"></script>
</body>
</html>
